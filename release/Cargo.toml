[package]
name = "wisent-node-release"
edition = "2021"
description = "The release contract of the wisent npm package: its public surface, read statically, and the baseline of the version npm serves"
license = "MIT"
publish = false

[[bin]]
name = "wisent-node-release"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
# package.json's `exports` map is ordered: its first matching condition wins.
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
tar = "0.4"
ureq = "2"
